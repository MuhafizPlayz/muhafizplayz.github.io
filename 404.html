<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Muhafız Playz</title><meta name="robots" content="noindex">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#151517;color:#f5f5f6;font-family:"Segoe UI",system-ui,Arial,sans-serif;text-align:center;padding:20px}
h1{font-size:4rem;margin:0;color:#ffb300}p{color:#a0a0ab}a{display:inline-block;margin-top:14px;padding:12px 22px;border-radius:10px;background:linear-gradient(135deg,#ffb300,#f57c00);color:#1a1100;font-weight:700;text-decoration:none}</style></head>
<body><div><h1>404</h1><p>We could not find that page.</p><a id="home" href="/">Go to homepage</a></div>
<script>
// Works on github.io/REPO-NAME/ and on a custom domain.
(function(){var p=location.pathname.split("/").filter(Boolean);var base=/\.github\.io$/.test(location.hostname)&&p.length?"/"+p[0]+"/":"/";document.getElementById("home").href=base;})();
</script></body></html>
