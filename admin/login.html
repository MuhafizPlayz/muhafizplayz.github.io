<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin sign in | Muhafız Playz</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../assets/logo/favicon.png">
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/admin.css"></head>
<body data-root="../">
<div class="login-box"><img src="../assets/logo/icon.png" alt="" width="56" height="56"><h1>Admin sign in</h1>
<form id="login-form" class="form" style="max-width:none">
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username" style="width:100%;min-height:44px;padding:0 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line)"></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password" style="width:100%;min-height:44px;padding:0 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line)"></div>
<button class="btn btn-primary" type="submit">Sign in</button><div id="msg"></div></form>
<p class="dl-note" style="margin-top:14px">Administrators only. Accounts are created by the site owner in Supabase.</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/app.js"></script><script src="../js/auth.js"></script>
</body></html>
